<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Examora - Online Examination Portal</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background: #fafafa; color: #222; }
        .top-banner { background: #1a2a3a; color: #fff; text-align: center; padding: 8px; font-size: 13px; font-weight: 500; letter-spacing: 1px; }
        nav { display: flex; justify-content: space-between; align-items: center; padding: 20px 80px; background: #fff; border-bottom: 1px solid #eee; }
        .logo { font-size: 24px; font-weight: bold; color: #111; }
        .logo span { color: #d4a373; }
        .nav-links a { margin: 0 15px; text-decoration: none; color: #555; font-size: 14px; font-weight: 500; text-transform: uppercase; }
        .btn-login { background: #b7e4c7; color: #1b4332; padding: 8px 18px; border-radius: 4px; text-decoration: none; font-weight: 600; font-size: 14px; }
        .hero { display: flex; align-items: center; justify-content: space-between; padding: 80px 100px; max-width: 1200px; margin: 0 auto; }
        .hero-text { max-width: 50%; }
        .subhead { color: #888; font-size: 13px; text-transform: uppercase; font-weight: 600; letter-spacing: 1.5px; margin-bottom: 12px; }
        h1 { font-size: 48px; line-height: 1.15; color: #1b263b; margin-bottom: 20px; font-family: Georgia, serif; }
        p { font-size: 16px; color: #555; line-height: 1.6; margin-bottom: 30px; }
        .actions { display: flex; gap: 15px; }
        .btn-primary { background: #d8f3dc; color: #2d6a4f; padding: 12px 24px; border-radius: 4px; text-decoration: none; font-weight: bold; font-size: 13px; letter-spacing: 0.5px; }
        .btn-secondary { background: transparent; border: 1px solid #ddd; color: #444; padding: 12px 24px; border-radius: 4px; text-decoration: none; font-weight: bold; font-size: 13px; }
    </style>
</head>
<body>
    <div class="top-banner">YOUR NEXT MILESTONE IS CLOSER THAN YOU THINK</div>
    <nav>
        <div class="logo">E <span>Examora</span></div>
        <div class="nav-links">
            <a href="/">My Exams</a>
            <a href="/">Subjects</a>
            <a href="/">Progress</a>
            <a href="/">Help</a>
            <a href="/login" class="btn-login">Login</a>
        </div>
    </nav>
    <section class="hero">
        <div class="hero-text">
            <div class="subhead">WELCOME TO EXAMORA</div>
            <h1>Ready to test what you know?</h1>
            <p>Pick up where you left off, practice a new topic, or take your next timed assessment.</p>
            <div class="actions">
                <a href="/login" class="btn-primary">VIEW MY EXAMS</a>
                <a href="/" class="btn-secondary">EXPLORE SUBJECTS</a>
            </div>
        </div>
    </section>
</body>
</html>
