<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - ExamSphere</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background: #fafafa; color: #222; }
        .top-banner { background: #1a2a3a; color: #fff; text-align: center; padding: 8px; font-size: 13px; font-weight: 500; }
        nav { display: flex; justify-content: space-between; align-items: center; padding: 20px 80px; background: #fff; border-bottom: 1px solid #eee; }
        .logo { font-size: 24px; font-weight: bold; color: #111; }
        .login-container { display: flex; max-width: 900px; margin: 60px auto; background: #fff; border-radius: 8px; box-shadow: 0 4px 20px rgba(0,0,0,0.06); overflow: hidden; }
        .sidebar { background: #1b2a4a; color: #fff; padding: 60px 40px; width: 45%; }
        .sidebar h2 { font-size: 36px; line-height: 1.2; font-family: Georgia, serif; margin: 20px 0; }
        .sidebar p { color: #cbd5e1; font-size: 14px; line-height: 1.6; }
        .form-section { padding: 60px 50px; width: 55%; }
        .form-section h3 { font-size: 24px; margin-bottom: 25px; color: #1e293b; }
        .input-group { margin-bottom: 20px; }
        label { display: block; font-size: 12px; font-weight: 600; color: #64748b; margin-bottom: 6px; text-transform: uppercase; }
        input { width: 100%; padding: 12px; border: 1px solid #cbd5e1; border-radius: 4px; font-size: 14px; }
        .btn-submit { width: 100%; padding: 12px; background: #c8e6c9; color: #2e7d32; font-weight: bold; border: none; border-radius: 4px; cursor: pointer; text-transform: uppercase; font-size: 13px; }
    </style>
</head>
<body>
    <div class="top-banner">YOUR NEXT MILESTONE IS CLOSER THAN YOU THINK</div>
    <nav>
        <div class="logo">E ExamSphere</div>
        <a href="/" style="text-decoration:none; color:#555; font-size:13px; font-weight:600;">BACK TO HOME</a>
    </nav>
    <div class="login-container">
        <div class="sidebar">
            <span style="font-size:11px; letter-spacing:1px; text-transform:uppercase; color:#94a3b8;">WELCOME BACK</span>
            <h2>Pick up where you left off.</h2>
            <p>Your next practice session, progress update, and exam result are waiting for you.</p>
        </div>
        <div class="form-section">
            <h3>Log in to ExamSphere</h3>
            <div class="input-group">
                <label>Username</label>
                <input type="text" placeholder="Enter your username">
            </div>
            <div class="input-group">
                <label>Password</label>
                <input type="password" placeholder="Enter your password">
            </div>
            <button class="btn-submit">LOGIN</button>
        </div>
    </div>
</body>
</html>
